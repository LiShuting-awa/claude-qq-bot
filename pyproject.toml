[project]
name = "qqbot-claude"
version = "0.3.0"
description = "A QQ bot powered by NoneBot2 + OneBot 11 + Anthropic Claude"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[aiohttp]==2.5.0",
    "nonebot-adapter-onebot==2.4.6",
    "anthropic==1.17.0",
    "httpx2==2.16.0",
    "yt-dlp==2026.10.21.233146.dev0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "pillow==12.3.0",
    "nonebot-plugin-parsehub==1.0.4",
]

[tool.nonebot]
plugin_dirs = ["plugins"]
plugins = ["nonebot_plugin_localstore", "nonebot_plugin_parsehub"]
